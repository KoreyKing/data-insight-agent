# 用户态：拉取预构建镜像，一行启动 —— docker compose up -d
# 前端与 API 同在 8000（后端托管前端静态产物）。
# 本地开发/构建请叠加 docker-compose.dev.yml（见 README）。
services:
  app:
    image: ghcr.io/${GHCR_OWNER:-koreyking}/${GHCR_REPO:-data-insight-agent}:${GHCR_TAG:-latest}
    container_name: data-insight-agent
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      - APP_DB_URL=sqlite:////app/data/app.db
    restart: unless-stopped
